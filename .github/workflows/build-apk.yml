name: Build Android Debug APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Try Harder, Loser Debug APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web game assets for Android
        id: build_web
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -R dist/. app/src/main/assets/
          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "::error::Built web bundle missing app/src/main/assets/index.html."
            exit 1
          fi
          echo "Bundled web game assets into app/src/main/assets/."

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Could not detect active Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f2)"
          else
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f1 | sed -E 's/[^0-9].*$//')"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VER}"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VER}."
            exit 1
          fi

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager || true)"
            fi
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
            set -o pipefail
          else
            echo "::warning::sdkmanager not found; relying on preinstalled Android SDK."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL" ]; then
            echo "::error::keytool executable not found in configured Java installation (${JAVA_HOME})."
            exit 1
          fi
          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore is missing or empty after generation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK and AAB
        id: build_android
        shell: bash
        run: |
          gradle :app:assembleDebug :app:bundleDebug --stacktrace --no-daemon

      - name: Verify debug APK and AAB
        id: verify_android
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ] || [ -L "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is missing, not a regular file, or empty."
            exit 1
          fi
          APK_BYTES="$(wc -c < "$EXPECTED_APK" | tr -d '[:space:]')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_BYTES} bytes)"

          EXPECTED_AAB="app/build/outputs/bundle/debug/app-debug.aab"
          if [ ! -e "$EXPECTED_AAB" ]; then
            echo "::error::Expected debug AAB was not found at ${EXPECTED_AAB}."
            if [ -d "app/build/outputs/bundle" ]; then
              echo "Discovered AAB files under app/build/outputs/bundle:"
              find app/build/outputs/bundle -type f -name '*.aab' -print || true
            else
              echo "Directory app/build/outputs/bundle does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_AAB" ] || [ -L "$EXPECTED_AAB" ] || [ ! -s "$EXPECTED_AAB" ]; then
            echo "::error::${EXPECTED_AAB} is missing, not a regular file, or empty."
            exit 1
          fi
          AAB_BYTES="$(wc -c < "$EXPECTED_AAB" | tr -d '[:space:]')"
          echo "Verified debug AAB: ${EXPECTED_AAB} (${AAB_BYTES} bytes)"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB artifact
        id: upload_aab_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Prepare APK and AAB release assets
        id: prepare_release_assets
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          SOURCE_AAB="app/build/outputs/bundle/debug/app-debug.aab"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified source APK missing at ${SOURCE_APK}."
            exit 1
          fi
          if [ ! -f "$SOURCE_AAB" ] || [ ! -s "$SOURCE_AAB" ]; then
            echo "::error::Verified source AAB missing at ${SOURCE_AAB}."
            exit 1
          fi
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/android-release-XXXXXX")"
          APK_ASSET_PATH="${RELEASE_DIR}/app-debug.apk"
          AAB_ASSET_PATH="${RELEASE_DIR}/app-debug.aab"
          cp -- "$SOURCE_APK" "$APK_ASSET_PATH"
          cp -- "$SOURCE_AAB" "$AAB_ASSET_PATH"
          if [ ! -f "$APK_ASSET_PATH" ] || [ ! -s "$APK_ASSET_PATH" ]; then
            echo "::error::Failed to prepare APK release asset at ${APK_ASSET_PATH}."
            exit 1
          fi
          if [ ! -f "$AAB_ASSET_PATH" ] || [ ! -s "$AAB_ASSET_PATH" ]; then
            echo "::error::Failed to prepare AAB release asset at ${AAB_ASSET_PATH}."
            exit 1
          fi
          echo "apk_asset_path=${APK_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "aab_asset_path=${AAB_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "Prepared release assets: $(basename "$APK_ASSET_PATH"), $(basename "$AAB_ASSET_PATH")"

      - name: Publish APK and AAB to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_release_assets.outputs.apk_asset_path }}
          PREPARED_AAB: ${{ steps.prepare_release_assets.outputs.aab_asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${PREPARED_APK:-}" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Prepared APK is missing, not a regular file, or empty."
            exit 1
          fi
          if [ -z "${PREPARED_AAB:-}" ] || [ ! -f "$PREPARED_AAB" ] || [ ! -s "$PREPARED_AAB" ]; then
            echo "::error::Prepared AAB is missing, not a regular file, or empty."
            exit 1
          fi

          RELEASE_TAG="debug-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK & AAB Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated Android game debug APK and AAB built using GitHub Actions.

          - Game name: Try Harder, Loser
          - Workflow run number: ${GITHUB_RUN_NUMBER}
          - Workflow run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Artifacts: \`app-debug.aab\` (Android App Bundle) and \`app-debug.apk\` (Debug APK)
          - Purpose: Intended for game testing (not a Google Play production release)
          - Signing: Signed using a temporary debug keystore
          EOF
          )"

          gh release create "$RELEASE_TAG" "$PREPARED_AAB" "$PREPARED_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK and AAB download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_BUILD_OUTCOME: ${{ steps.build_web.outcome }}
          BUILD_OUTCOME: ${{ steps.build_android.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_android.outcome }}
          APK_ARTIFACT_OUTCOME: ${{ steps.upload_apk_artifact.outcome }}
          AAB_ARTIFACT_OUTCOME: ${{ steps.upload_aab_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK & AAB Build #${GITHUB_RUN_NUMBER}"
          DIRECT_AAB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.aab"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            gh release view "$RELEASE_TAG" >/dev/null
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release page URL: ${RELEASE_URL}"
            echo "DIRECT AAB DOWNLOAD: ${DIRECT_AAB_URL}"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Backup Actions artifacts 'app-debug-aab' and 'app-debug-apk' remain available."

            {
              echo "## DIRECT ANDROID DEBUG DOWNLOADS"
              echo ""
              echo "- **Debug AAB (\`app-debug.aab\`):** ${DIRECT_AAB_URL}"
              echo "- **Debug APK (\`app-debug.apk\`):** ${DIRECT_APK_URL}"
              echo ""
              echo "- **Release tag:** \`${RELEASE_TAG}\`"
              echo "- **Release title:** ${RELEASE_TITLE}"
              echo "- **Release page:** ${RELEASE_URL}"
              echo "- **Backup artifacts:** \`app-debug-aab\` and \`app-debug-apk\` remain available in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (release step outcome: ${RELEASE_OUTCOME})."
            echo "Web build outcome: ${WEB_BUILD_OUTCOME}"
            if [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
              echo "Android build status: succeeded (app-debug.apk and app-debug.aab verified)."
            else
              echo "Android build status: failed or did not complete (build: ${BUILD_OUTCOME}, verify: ${VERIFY_OUTCOME})."
            fi
            echo "Actions artifact 'app-debug-aab': ${AAB_ARTIFACT_OUTCOME}"
            echo "Actions artifact 'app-debug-apk': ${APK_ARTIFACT_OUTCOME}"

            {
              echo "## Release Publishing Warning"
              echo ""
              echo "Publishing the GitHub Release did not succeed (\`${RELEASE_OUTCOME}\`). The latest-release direct download URLs were not updated."
              echo ""
              echo "- **Web assets build outcome:** \`${WEB_BUILD_OUTCOME}\`"
              echo "- **Android build outcome:** \`${BUILD_OUTCOME}\` (verify: \`${VERIFY_OUTCOME}\`)"
              echo "- **Actions artifact (\`app-debug-aab\`):** \`${AAB_ARTIFACT_OUTCOME}\`"
              echo "- **Actions artifact (\`app-debug-apk\`):** \`${APK_ARTIFACT_OUTCOME}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
