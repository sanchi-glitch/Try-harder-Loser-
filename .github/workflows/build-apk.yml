name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Try Harder, Loser Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web game assets for Android
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -R dist/. app/src/main/assets/
          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "::error::Built web bundle missing app/src/main/assets/index.html."
            exit 1
          fi
          echo "Bundled web game assets into app/src/main/assets/."

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Could not detect active Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f2)"
          else
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f1 | sed -E 's/[^0-9].*$//')"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VER}"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VER}."
            exit 1
          fi

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          else
            echo "::warning::sdkmanager not found; relying on preinstalled Android SDK."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL" ]; then
            echo "::error::keytool executable not found in configured Java installation (${JAVA_HOME})."
            exit 1
          fi
          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore is missing or empty after generation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ] || [ -L "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Verified APK path does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi
          APK_BYTES="$(wc -c < "$EXPECTED_APK" | tr -d '[:space:]')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_BYTES} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified source APK missing at ${SOURCE_APK}."
            exit 1
          fi
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          ASSET_PATH="${RELEASE_DIR}/app-debug.apk"
          cp -- "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at ${ASSET_PATH}."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $(basename "$ASSET_PATH")"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_release_asset.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${PREPARED_APK:-}" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Prepared APK is missing, not a regular file, or empty."
            exit 1
          fi

          ASSET_FILENAME="$(basename "$PREPARED_APK")"
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "::error::Prepared release asset filename must be app-debug.apk, got ${ASSET_FILENAME}."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated Android game debug APK built using GitHub Actions.

          - Game name: Try Harder, Loser
          - Workflow run number: ${GITHUB_RUN_NUMBER}
          - Workflow run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Purpose: Intended for game testing (not a Google Play production release)
          - Signing: Signed using a temporary debug keystore
          EOF
          )"

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            gh release view "$RELEASE_TAG" >/dev/null
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release page URL: ${RELEASE_URL}"
            echo "APK filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup Actions artifact 'app-debug-apk' remains available."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release tag:** \`${RELEASE_TAG}\`"
              echo "- **Release title:** ${RELEASE_TITLE}"
              echo "- **Release page:** ${RELEASE_URL}"
              echo "- **APK filename:** \`app-debug.apk\`"
              echo "- **Backup artifact:** \`app-debug-apk\` remains available in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (release step outcome: ${RELEASE_OUTCOME})."
            if [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
              echo "APK build status: succeeded (app/build/outputs/apk/debug/app-debug.apk verified)."
            else
              echo "APK build status: failed or did not complete (build: ${BUILD_OUTCOME}, verify: ${VERIFY_OUTCOME})."
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "Actions artifact 'app-debug-apk' remains available for download from this workflow run."
            else
              echo "Actions artifact 'app-debug-apk' was not uploaded (outcome: ${ARTIFACT_OUTCOME})."
            fi

            {
              echo "## Release Publishing Warning"
              echo ""
              echo "Publishing the GitHub Release did not succeed (\`${RELEASE_OUTCOME}\`). The latest-release direct download URL was not updated."
              echo ""
              echo "- **APK build outcome:** \`${BUILD_OUTCOME}\` (verify: \`${VERIFY_OUTCOME}\`)"
              echo "- **Actions artifact (\`app-debug-apk\`):** \`${ARTIFACT_OUTCOME}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
